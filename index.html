<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Little Hands Button Party</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <div id="paint-layer" class="paint-layer" aria-hidden="true"></div>
      <div class="paint-splotch splotch-one" aria-hidden="true"></div>
      <div class="paint-splotch splotch-two" aria-hidden="true"></div>
      <div class="paint-splotch splotch-three" aria-hidden="true"></div>
      <header class="hero">
        <p class="eyebrow">Big bright buttons</p>
        <h1>Little Hands Button Party</h1>
        <p class="hero-copy">
          Tap the colorful buttons and enjoy a cheerful little surprise each time.
        </p>
      </header>

      <main class="content">
        <section class="button-board" aria-label="Colorful buttons">
          <button class="color-button pink" data-title="Sunny Sun" data-message="You pressed the sunny button!">☀️ Sunny</button>
          <button class="color-button blue" data-title="Bouncy Blue" data-message="You pressed the blue button!">💧 Blue</button>
          <button class="color-button yellow" data-title="Happy Yellow" data-message="You pressed the yellow button!">🌼 Yellow</button>
          <button class="color-button green" data-title="Green Glow" data-message="You pressed the green button!">🌿 Green</button>
          <button class="color-button purple" data-title="Purple Party" data-message="You pressed the purple button!">🪄 Purple</button>
          <button class="color-button orange" data-title="Sparkly Orange" data-message="You pressed the orange button!">✨ Orange</button>
        </section>

        <section class="message-panel" aria-live="polite">
          <div id="surprise-burst" class="surprise-burst" aria-hidden="true"></div>
          <h2 id="message-title">Pick a bright button</h2>
          <p id="message-text">Tap one and watch the fun appear.</p>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
